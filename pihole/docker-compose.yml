services:
  pihole:
    container_name: ${PIHOLE_CONTAINER:-pihole}
    image: pihole/pihole:latest
    hostname: pihole
    # Host networking avoids Docker port publishing and WSL address rebinding. Pi-hole
    # owns guest :5353; AdGuard Home owns guest :53.
    network_mode: host
    environment:
      TZ: "${PIHOLE_TZ:-Etc/UTC}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:-change-me}"
      # Answer queries arriving from any interface (Windows host + crosvm VM are on other subnets).
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_port: "${PIHOLE_DNS_PORT:-5353}"
      FTLCONF_dns_upstreams: "${PIHOLE_UPSTREAMS:-1.1.1.1;1.0.0.1}"
      FTLCONF_webserver_port: "${PIHOLE_WEB_PORT:-8053}"
    volumes:
      - "./etc-pihole:/etc/pihole"
    restart: unless-stopped
