---
- name: Detect Windows user profile (via interop)
  ansible.builtin.shell:
    cmd: >-
      profile="$(/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
      -NoProfile -NonInteractive -Command
      '[Console]::OutputEncoding=[Text.UTF8Encoding]::new(); $env:USERPROFILE'
      | tr -d '\r')";
      wslpath "$profile"
  register: winprofile
  changed_when: false
  failed_when: winprofile.rc != 0 or winprofile.stdout | trim == ''

# NAT keeps WSL isolated from Windows' DNS port. A Windows-native relay owns the changing
# guest address, while disabling DNS tunneling prevents the original recursive outage.
- name: Configure WSL networking for the DNS relay
  ansible.builtin.lineinfile:
    path: "{{ winprofile.stdout | trim }}/.wslconfig"
    regexp: "^{{ item.split('=')[0] }}\\s*="
    line: "{{ item }}"
    insertafter: '^\\[wsl2\\]'
    create: true
    mode: "0644"
  loop:
    - networkingMode=nat
    - dnsTunneling=false

- name: Remove superseded mirrored-only WSL settings
  ansible.builtin.lineinfile:
    path: "{{ winprofile.stdout | trim }}/.wslconfig"
    regexp: "^{{ item }}\\s*="
    state: absent
  loop:
    - hostAddressLoopback
    - ignoredPorts

- name: Ensure C:\Temp exists
  ansible.builtin.file:
    path: /mnt/c/Temp
    state: directory

# DNS persistence moved into the Python package (safehouse_setup), so there are no
# standalone .ps1 files to stage or keep in sync. The package is staged with the rest
# of the Windows tree below; arming it is:
#     C:\SafeHouse\python\python.exe -m safehouse_setup persist
- name: Stage the current Python packages
  ansible.builtin.copy:
    src: "{{ repo_dir }}/python/{{ item }}"
    dest: /mnt/c/SafeHouse/windows/youtube-budget/
  loop:
    - safehouse_setup
    - safehouse_ytbudget

- name: Ensure C:\SafeHouse working dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /mnt/c/SafeHouse/windows
    - /mnt/c/SafeHouse/windows/parental-blocks
    - /mnt/c/SafeHouse/windows/youtube-budget
    - /mnt/c/SafeHouse/blocklists
    - /mnt/c/SafeHouse/logs

- name: Deploy the connection-layer ad blocker toolkit to C:\SafeHouse
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - { src: "{{ repo_dir }}/windows/safehouse-adblock.ps1", dest: /mnt/c/SafeHouse/windows/safehouse-adblock.ps1 }
    - { src: "{{ repo_dir }}/windows/parental-blocks/youtube.txt", dest: /mnt/c/SafeHouse/windows/parental-blocks/youtube.txt }
    - { src: "{{ repo_dir }}/blocklists/ad-ip-ranges.txt",   dest: /mnt/c/SafeHouse/blocklists/ad-ip-ranges.txt }
    - { src: "{{ repo_dir }}/blocklists/ad-watchlist.txt",   dest: /mnt/c/SafeHouse/blocklists/ad-watchlist.txt }

# Current Python entry points. The relative ..\parental-blocks\youtube.txt path stays
# resolvable under the staged layout.
- name: Deploy the Python entry points to C:\SafeHouse
  ansible.builtin.copy:
    src: "{{ repo_dir }}/python/{{ item }}"
    dest: "/mnt/c/SafeHouse/windows/youtube-budget/{{ item | basename }}"
  loop:
    - install.py
    - adguard_daily_reset.py

- name: Remaining ADMIN steps (cannot self-elevate from WSL)
  ansible.builtin.debug:
    msg:
      - "Pi-hole is up. One-time ADMIN steps remain (elevated PowerShell):"
      - "1) Arm relay:      C:\\SafeHouse\\python\\python.exe -m safehouse_setup persist"
      - "2) Point DNS:      C:\\SafeHouse\\python\\python.exe -m safehouse_setup dns"
      - "3) Arm firewall:   powershell -ExecutionPolicy Bypass -File C:\\SafeHouse\\windows\\safehouse-adblock.ps1  (with ads showing)"
      - "4) (Optional) Arm YouTube budget: cd C:\\SafeHouse\\windows\\youtube-budget; C:\\SafeHouse\\python\\python.exe install.py"
      - "Then RESTART Google Play Games so the crosvm VM picks up Pi-hole. See windows/README.md."
