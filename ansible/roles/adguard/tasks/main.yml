---
# Runs only when safehouse_enable_adguard is true (gated in playbook.yml).
# Assumes the pihole role has moved Pi-hole to host port 5353.

- name: Ensure the adguard dir exists
  ansible.builtin.file:
    path: "{{ adguard_dir }}"
    state: directory
    mode: "0750"

- name: Deploy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ repo_dir }}/adguard/docker-compose.yml"
    dest: "{{ adguard_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy the idempotent AdGuard configuration owner
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ adguard_dir }}/{{ item | basename }}"
    mode: "0750"
  loop:
    - "{{ repo_dir }}/adguard/bootstrap.py"
    - "{{ repo_dir }}/adguard/apply-filters.py"
    - "{{ repo_dir }}/adguard/adguard_api.py"
    - "{{ repo_dir }}/adguard/filters.json"
    - "{{ repo_dir }}/adguard/user-rules.txt"

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ adguard_dir }}/.env"
    mode: "0600"

# Both want :53 on the same IP, so a Pi-hole still holding it makes AdGuard Home fail to
# bind. Caught here with a clear message rather than as an opaque compose error.
- name: Verify Pi-hole has released :53
  ansible.builtin.shell: |
    set -o pipefail
    docker ps --format '{% raw %}{{.Names}}\t{{.Ports}}{% endraw %}' | grep -E '^{{ pihole_container }}\b' || true
  args:
    executable: /bin/bash
  become: "{{ docker_become | default(false) }}"
  register: _pihole_ports
  changed_when: false

- name: Fail when Pi-hole still holds :53
  ansible.builtin.fail:
    msg: >-
      Pi-hole is still published on :53 ({{ _pihole_ports.stdout }}). AdGuard Home cannot
      bind :53 on the same IP. Re-run with -e safehouse_enable_adguard=true so the pihole
      role moves it to :5353 first.
  when: "':53->' in _pihole_ports.stdout"

- name: Start AdGuard Home
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ adguard_dir }}"
  become: "{{ docker_become | default(false) }}"
  register: _up
  changed_when: >-
    'Started' in _up.stderr or 'Created' in _up.stderr or 'Recreated' in _up.stderr

- name: Wait for the AdGuard Home web UI
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_web_port }}/"
    status_code: [200, 302, 403]
  register: _web
  until: _web.status is defined and _web.status in [200, 302, 403]
  retries: 30
  delay: 2

# The first-run wizard is interactive by design, and it is the one thing that would
# stop this being an unattended install. AdGuard exposes it as an API, so bootstrap.py
# drives it: completes setup, points it at Pi-hole, enables the parental settings and
# applies the filter set. Idempotent, so re-running the playbook is safe.
- name: Configure AdGuard Home (wizard, upstream, filters)
  ansible.builtin.command:
    cmd: >-
      python3 {{ adguard_dir }}/bootstrap.py
      --base-url http://127.0.0.1:{{ adguard_web_port }}
      --upstream 127.0.0.1:{{ adguard_upstream_port }}
      --password-file {{ adguard_dir }}/.admin-password
  register: _bootstrap
  changed_when: "'already configured' not in _bootstrap.stdout"

- name: Lock down the generated admin password
  ansible.builtin.file:
    path: "{{ adguard_dir }}/.admin-password"
    mode: "0600"

- name: AdGuard Home summary
  ansible.builtin.debug:
    msg:
      - "AdGuard Home : http://localhost:{{ adguard_web_port }}  (user: admin)"
      - "Password     : {{ adguard_dir }}/.admin-password"
      - "Upstream     : 127.0.0.1:{{ adguard_upstream_port }} (Pi-hole)"
      - "Verify       : dig @127.0.0.1 doubleclick.net +short   -> 0.0.0.0"
