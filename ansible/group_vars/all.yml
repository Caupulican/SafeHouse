---
# SafeHouse deployment switches. Override on the command line, e.g.
#   ansible-playbook -i inventory.ini playbook.yml -e safehouse_enable_adguard=true

# Chain AdGuard Home in front of Pi-hole. When true, AdGuard Home takes :53 on the WSL
# IP and Pi-hole moves to :5353 as its upstream, which adds per-client policy and
# time-of-day schedules. The Windows adapter stays on its localhost relay either way, so
# this is invisible from Windows. See docs/ADGUARD.md.
safehouse_enable_adguard: false

# Timezone for both containers. Also drives AdGuard Home's schedule windows -- get this
# wrong and a "blocked after 20:00" rule fires at the wrong hour.
safehouse_tz: Etc/UTC

# Upstream resolvers for whatever the chain does not block.
safehouse_upstreams_semicolon: "1.1.1.1;1.0.0.1"
