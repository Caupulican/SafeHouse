---
# SafeHouse: deploy the DNS filtering stack on this WSL2 machine.
#
#   ansible-playbook -i inventory.ini playbook.yml
#   ansible-playbook -i inventory.ini playbook.yml -e safehouse_enable_adguard=true
#
# Installs docker if missing, brings up Pi-hole (and optionally AdGuard Home chained in
# front of it), loads the blocklists, installs the weekly auto-update, and arms a
# five-minute DNS-stack watchdog when AdGuard is enabled.
#
# The Windows admin steps -- point the adapter DNS, arm the logon task, arm the firewall
# blocker, arm the YouTube budget -- need UAC and cannot run from here. They are printed
# at the end by the windows_persistence role.
- name: SafeHouse DNS filtering stack
  hosts: local
  connection: local
  gather_facts: true
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
  roles:
    - prereqs
    - pihole
    - role: adguard
      when: safehouse_enable_adguard | default(false) | bool
    - tools
    - automation
    - windows_persistence
